# ApexRust Quant — Production Configuration Example
# Copy to `config/bot.toml` and adjust for Testnet or Production.

[exchange]
environment = "testnet" # "testnet" | "production"
venue = "spot"          # "spot" | "futures"
leverage = 3            # Used when venue = "futures" (1..=20)
margin_type = "ISOLATED"# "ISOLATED" | "CROSSED"
paper_trading = true    # Isolated virtual paper sandbox when true; live signed orders require credentials + armed_for_live_orders
ws_stream_url = "wss://stream.testnet.binance.vision/stream"
ws_api_url = "wss://ws-api.testnet.binance.vision/ws-api/v3"
rest_base_url = "https://testnet.binance.vision"
# Transport Failover & Watchdog
ws_heartbeat_timeout_ms = 4500
rest_poll_interval_ms = 1500
ws_reconnect_initial_ms = 1000
ws_reconnect_max_ms = 30000
max_consecutive_rest_failures = 5

[exchange.credentials]
auth_method = "hmac-sha256" # "hmac-sha256" | "ed25519"
api_key_env = "BINANCE_API_KEY"
api_secret_env = "BINANCE_API_SECRET"
recv_window_ms = 5000
max_order_notional_usdt = 250.0
require_preflight_test_order = true
armed_for_live_orders = false

[trading]
mode = "scalping" # "scalping" | "intraday"
timeframe = "5m"  # "1m" | "3m" | "5m" | "15m"
pairs = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "AVAXUSDT"]
max_concurrent_positions = 3
base_risk_per_trade_pct = 0.75
position_sizing_mode = "fixed_usdt" # "fixed_usdt" | "fixed_risk_pct" | "quarter_kelly" | "half_kelly" | "full_kelly"
initial_equity_usdt = 10000.0
taker_fee_bps = 10.0

[automation]
enabled = true
strategy_profile = "trend_pullback" # "trend_pullback" | "ema_breakout" | "vwap_reversion"
direction_policy = "long_only"      # "long_only" (Spot safe) | "both" (Futures Long/Short)
order_method = "MARKET"             # "MARKET" | "LIMIT" | "LIMIT_MAKER" | "OCO"
limit_offset_bps = 5.0
time_in_force = "GTC"               # "GTC" | "IOC" | "FOK"
signal_cooldown_bars = 2
auto_order_notional_usdt = 150.0
auto_close_on_exit = true

[[automation.session_windows]]
id = "london-open"
label = "London Open"
start_utc = "07:00"
end_utc = "11:00"
enabled = true

[[automation.session_windows]]
id = "london-ny-overlap"
label = "London / NY Overlap"
start_utc = "12:30"
end_utc = "16:30"
enabled = true

[[automation.session_windows]]
id = "us-close-auction"
label = "US Equities Close"
start_utc = "19:00"
end_utc = "21:00"
enabled = false

[features]
automated_trading = true
manual_trading = true
signal_generator = true
ws_primary_feed = true
rest_fallback = true
ema_trend_filter = true
rsi_momentum_filter = true
adx_strength_filter = true
vwap_bias_filter = true
volume_confirmation_filter = false
session_window_filter = false
atr_dynamic_exits = true
take_profit_ladder = true
break_even_stop = true
trailing_stop = true
circuit_breaker = true
spot_market = true
futures_market = true
git_auto_backup = false

[indicators]
ema_fast = 9
ema_mid = 21
ema_slow = 50
ema_macro = 200
rsi_period = 14
rsi_long_pullback_min = 42.0
rsi_long_pullback_max = 58.0
rsi_short_pullback_min = 42.0
rsi_short_pullback_max = 58.0
adx_period = 14
adx_min_trend = 25.0
atr_period = 14
require_vwap_alignment = true
min_volume_expansion_mult = 1.5
volatility_alerts_enabled = true
atr_spike_pct_threshold = 0.45
atr_expansion_ratio_threshold = 1.25
volatility_alert_cooldown_sec = 60

[exits]
atr_sl_multiplier = 1.5
atr_tp1_multiplier = 2.25
atr_tp2_multiplier = 3.75
tp1_close_ratio = 0.50
break_even_trigger_r = 1.0
break_even_fee_buffer_bps = 12.0
trailing_activation_r = 1.2
atr_trailing_multiplier = 1.4

[risk]
max_daily_drawdown_pct = 3.0
max_pair_daily_drawdown_pct = 1.25
max_daily_profit_pct = 5.0
max_win_streak = 5
max_lose_streak = 3
streak_cooldown_minutes = 30
flatten_on_circuit_breaker = true

[git_backup]
enabled = true
remote_name = "origin"
branch = "main"
auto_push = false
backup_dir = "backups"

[web]
bind_addr = "127.0.0.1:8080"
allowed_origin = "http://localhost:3000"
