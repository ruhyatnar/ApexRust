[exchange]
environment = "testnet"
venue = "spot"
leverage = 3
max_leverage = 3
margin_type = "ISOLATED"
paper_trading = true
ws_stream_url = "wss://stream.testnet.binance.vision/stream"
ws_api_url = "wss://ws-api.testnet.binance.vision/ws-api/v3"
use_ws_api_orders = false
depth_stream_enabled = false
rest_base_url = "https://testnet.binance.vision"
ws_heartbeat_timeout_ms = 4500
rest_poll_interval_ms = 1500
ws_reconnect_initial_ms = 1000
ws_reconnect_max_ms = 30000
max_consecutive_rest_failures = 5

[trading]
mode = "scalping"
timeframe = "5m"
pairs = [
    "BTCUSDT",
    "ETHUSDT",
    "SOLUSDT",
    "BNBUSDT",
    "AVAXUSDT",
]
max_concurrent_positions = 3
base_risk_per_trade_pct = 0.75
position_sizing_mode = "fixed_usdt"
initial_equity_usdt = 10000.0
taker_fee_bps = 10.0
pair_selection_mode = "hybrid"
quote_asset = "USDT"
max_watchlist_pairs = 20
trending_category = "hot_volume"
trending_top_n = 5
trending_min_quote_volume_usdt = 10000000.0
trending_min_dwell_minutes = 15
trending_hysteresis_rank_buffer = 3
ranking_source = "auto"
max_same_direction_positions = 2
cts_screener_enabled = false
cts_rvol_weight = 0.4
cts_momentum_weight = 0.4
cts_volume_weight = 0.2
cts_min_rvol = 1.2

[indicators]
ema_fast = 9
ema_mid = 21
ema_slow = 50
ema_macro = 200
rsi_period = 14
rsi_long_pullback_min = 42.0
rsi_long_pullback_max = 58.0
rsi_short_pullback_min = 42.0
rsi_short_pullback_max = 58.0
adx_period = 14
adx_min_trend = 25.0
atr_period = 14
require_vwap_alignment = true
min_volume_expansion_mult = 1.5
volatility_alerts_enabled = true
atr_spike_pct_threshold = 0.45
atr_expansion_ratio_threshold = 1.25
volatility_alert_cooldown_sec = 60
min_warmup_bars = 50
max_ema_mid_extension_atr = 2.2
max_vwap_extension_atr = 2.8
min_close_strength_ratio = 0.55
min_candle_body_ratio = 0.3
require_rising_adx = true
min_di_spread = 3.0
require_macro_ema_in_scalping = true
max_spread_bps = 20.0
donchian_lookback = 20
atr_expansion_filter_enabled = false
atr_expansion_min_ratio = 1.15
htf_ema_period = 200
obi_levels = 10
obi_min_imbalance = 0.35

[exits]
atr_sl_multiplier = 1.5
atr_tp1_multiplier = 2.25
atr_tp2_multiplier = 3.75
tp1_close_ratio = 0.5
break_even_trigger_r = 1.0
break_even_fee_buffer_bps = 25.0
trailing_activation_r = 1.2
atr_trailing_multiplier = 1.4

[risk]
max_daily_drawdown_pct = 3.0
max_pair_daily_drawdown_pct = 1.25
max_daily_profit_pct = 5.0
max_win_streak = 5
max_lose_streak = 3
streak_cooldown_minutes = 30
flatten_on_circuit_breaker = true
btc_crash_guard_enabled = true
btc_crash_threshold_pct = 1.5
btc_crash_window_minutes = 15
btc_crash_max_staleness_sec = 120

[automation]
enabled = true
strategy_profile = "trend_pullback"
direction_policy = "long_only"
order_method = "MARKET"
limit_offset_bps = 5.0
time_in_force = "GTC"
signal_cooldown_bars = 2
auto_order_notional_usdt = 150.0
auto_close_on_exit = true
cancel_pending_on_signal_reversal = true
cancel_pending_on_exhaustion = true
max_pending_order_bars = 6
max_pending_runaway_atr = 1.8
apply_dynamic_cancel_to_manual_orders = false
exit_position_on_signal_reversal = true
tighten_trailing_on_exhaustion = true
exhaustion_min_profit_r = 1.0
exhaustion_trail_factor = 0.55
exhaustion_rsi_high = 76.0
exhaustion_rsi_low = 24.0
auto_flip_on_reversal = false

[[automation.session_windows]]
id = "london-open"
label = "London Open"
start_utc = "07:00"
end_utc = "11:00"
enabled = true

[[automation.session_windows]]
id = "london-ny-overlap"
label = "London / NY Overlap"
start_utc = "12:30"
end_utc = "16:30"
enabled = true

[[automation.session_windows]]
id = "us-close-auction"
label = "US Equities Close"
start_utc = "19:00"
end_utc = "21:00"
enabled = false

[features]
automated_trading = true
manual_trading = true
signal_generator = true
ws_primary_feed = true
rest_fallback = true
ema_trend_filter = true
rsi_momentum_filter = true
adx_strength_filter = true
vwap_bias_filter = true
volume_confirmation_filter = false
htf_trend_filter = false
obi_entry_filter = false
session_window_filter = false
atr_dynamic_exits = true
take_profit_ladder = true
break_even_stop = true
trailing_stop = true
circuit_breaker = true
spot_market = true
futures_market = true
git_auto_backup = false

[git_backup]
enabled = true
remote_name = "origin"
branch = "main"
auto_push = false
backup_dir = "backups"

[web]
bind_addr = "127.0.0.1:8080"
allowed_origin = "http://localhost:3000"
auth_token = ""
